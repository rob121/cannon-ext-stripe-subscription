{{if .Error}}<div class="admin-alert admin-alert-danger">{{.Error}}</div>{{end}}

<div class="stripe-admin">
  <div class="stripe-admin-toolbar">
    <div class="admin-page-actions">
      <a class="btn-admin-outline" href="{{.CancelURL}}" data-turbo-frame="_top"><i class="bi bi-arrow-left"></i> Back to Products</a>
    </div>
  </div>

  <div class="admin-data-card">
    <div class="admin-data-card-header">
      <div class="admin-data-card-summary-main">
        <h2 class="admin-data-card-title">{{.Title}}</h2>
        <p class="admin-data-card-desc">{{.Subtitle}}</p>
      </div>
    </div>
    <form method="post" action="{{.ActionURL}}" class="admin-form stripe-admin-form">
      {{.CSRFField}}
      <div class="row g-3">
        <div class="col-md-8">
          <label class="admin-form-label">Name</label>
          <input class="admin-form-control" name="name" value="{{.Row.Name}}" required>
        </div>
        <div class="col-md-4">
          <label class="admin-form-label">Display Cost</label>
          <input class="admin-form-control" name="cost" type="number" step="0.01" value="{{printf "%.2f" .Row.Cost}}">
        </div>
        <div class="col-12">
          <label class="admin-form-label">Description</label>
          <textarea class="admin-form-control" name="description" rows="10">{{.Row.Description}}</textarea>
          <p class="admin-form-help mb-0">HTML or Markdown. HTML is used when the content starts with tags; otherwise Markdown is rendered.</p>
        </div>
        <div class="col-md-4">
          <label class="admin-form-label">Period</label>
          <select class="admin-form-control" name="period">
            {{range $.Periods}}
            <option value="{{.}}" {{if eq $.Row.Period .}}selected{{end}}>{{.}}</option>
            {{end}}
          </select>
        </div>
        <div class="col-md-4">
          <label class="admin-form-label">Status</label>
          <select class="admin-form-control" name="status">
            <option value="active" {{if eq .Row.Status "active"}}selected{{end}}>Active</option>
            <option value="inactive" {{if eq .Row.Status "inactive"}}selected{{end}}>Inactive</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="admin-form-label">Sort</label>
          <input class="admin-form-control" name="sort" type="number" value="{{.Row.Sort}}">
        </div>
        <div class="col-md-6">
          <label class="admin-form-label">Stripe Price ID (Live)</label>
          <input class="admin-form-control" name="stripe_price_id" value="{{.Row.StripePriceID}}" placeholder="price_…">
        </div>
        <div class="col-md-6">
          <label class="admin-form-label">Stripe Price ID (Test)</label>
          <input class="admin-form-control" name="stripe_test_price_id" value="{{.Row.StripeTestPriceID}}" placeholder="price_…">
        </div>
        <div class="col-12">
          <label class="admin-form-check">
            <input type="checkbox" name="test_mode" value="1" {{if .Row.TestMode}}checked{{end}}>
            Use test Price ID and test secret key for this product
          </label>
        </div>
      </div>
      <div class="admin-form-actions">
        <button type="submit" class="btn-admin-primary">Save</button>
        <a class="btn-admin-outline" href="{{.CancelURL}}" data-turbo-frame="_top">Cancel</a>
      </div>
    </form>
  </div>
</div>

<style>
  .admin-extension-app .stripe-admin { display: flex; flex-direction: column; gap: 1.5rem; }
  .admin-extension-app .stripe-admin-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1rem;
  }
  .admin-extension-app .stripe-admin-form { padding: 1.25rem 1.5rem 1.5rem; }
  .admin-extension-app .stripe-admin-form .admin-form-actions {
    display: flex; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1.25rem;
    border-top: 1px solid var(--admin-border);
  }
</style>
